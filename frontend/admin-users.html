<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage users · CivicEvents+</title>
  <meta name="description" content="Administer CivicEvents+ member accounts.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121a2e'/%3E%3Cpath d='M7 14l9-6 9 6M9 14v9M13 14v9M19 14v9M23 14v9M6 25h20' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='6' r='3' fill='%23c8562a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="tw-config.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<!-- PAGE GUARD: admins only -->
<body data-auth="admin" data-page="admin-users" class="min-h-screen flex flex-col font-sans">
  <div id="app-header"></div>

  <main id="main" tabindex="-1" class="flex-1">
    <div class="mx-auto max-w-page px-4 sm:px-6 pt-8 grid lg:grid-cols-[15rem_1fr] gap-8">
      <aside id="admin-side" aria-label="Admin navigation"></aside>

      <div class="min-w-0">
        <p class="eyebrow mb-2">Admin</p>
        <h1 class="font-display text-4xl sm:text-5xl text-ink-900">Members</h1>
        <p class="mt-2 text-sm text-ink-600 max-w-2xl">Enable or disable accounts and view member profiles. Roles are assigned by the platform team and can’t be changed from here.</p>

        <div class="card p-4 mt-6 flex flex-col md:flex-row gap-3 md:items-center justify-between">
          <div class="relative flex-1 max-w-md">
            <label for="u-q" class="sr-only">Search members on this page</label>
            <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-ink-400"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
            <input id="u-q" type="search" class="field pl-10" placeholder="Search name or email">
          </div>
          <div class="flex flex-wrap gap-2" role="group" aria-label="Filter by status">
            <button type="button" class="chip" data-f="all" aria-pressed="true">All</button>
            <button type="button" class="chip" data-f="active" aria-pressed="false">Active</button>
            <button type="button" class="chip" data-f="disabled" aria-pressed="false">Disabled</button>
            <button type="button" class="chip" data-f="admin" aria-pressed="false">Admins</button>
          </div>
        </div>

        <div class="card mt-4 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="table w-full text-sm">
              <caption class="sr-only">Members list</caption>
              <thead class="bg-paper-100/70"><tr>
                <th scope="col">Member</th><th scope="col">Role</th><th scope="col">Joined</th><th scope="col">Active</th><th scope="col"><span class="sr-only">Actions</span></th>
              </tr></thead>
              <tbody id="u-body" aria-live="polite"></tbody>
            </table>
          </div>
          <div class="flex items-center justify-between gap-3 px-4 py-3 border-t border-paper-200">
            <p id="u-page" class="text-sm text-ink-600"></p>
            <div class="flex gap-2">
              <button type="button" id="prev" class="btn btn-ghost btn-sm" disabled>← Previous</button>
              <button type="button" id="next" class="btn btn-ghost btn-sm" disabled>Next →</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
  <script src="fx.js"></script>
  <script src="components.js"></script>
  <script src="page-admin-users.js"></script>
</body>
</html>
