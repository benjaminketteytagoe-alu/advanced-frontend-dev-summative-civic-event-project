<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events · CivicEvents+</title>
  <meta name="description" content="Browse and register for upcoming community events.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121a2e'/%3E%3Cpath d='M7 14l9-6 9 6M9 14v9M13 14v9M19 14v9M23 14v9M6 25h20' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='6' r='3' fill='%23c8562a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="tw-config.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<!-- PAGE GUARD: any signed-in user -->
<body data-auth="user" data-page="events" class="min-h-screen flex flex-col font-sans">
  <div id="app-header"></div>

  <main id="main" tabindex="-1" class="flex-1">
    <section class="mx-auto max-w-page px-4 sm:px-6 pt-10 pb-8">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div>
          <p class="eyebrow mb-2 reveal">Community calendar</p>
          <h1 class="font-display text-4xl sm:text-5xl text-ink-900 reveal" style="--d:60ms">Events near you</h1>
          <p class="mt-3 text-ink-600 reveal" style="--d:120ms" id="results-summary" aria-live="polite">Loading events…</p>
        </div>
        <!-- ADMIN-ONLY: create event -->
        <a href="event-form.html" class="btn btn-accent reveal" data-role="admin" hidden>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New event</a>
      </div>
    </section>

    <!-- Filters -->
    <section class="mx-auto max-w-page px-4 sm:px-6" aria-label="Filter events">
      <form id="filters" class="card p-4 sm:p-5 reveal" style="--d:160ms" role="search">
        <div class="grid gap-4 lg:grid-cols-[1.6fr_1fr_1fr_1fr_auto] items-end">
          <div>
            <label for="f-q" class="field-label">Search</label>
            <div class="relative">
              <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-ink-400"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
              <input id="f-q" name="q" type="search" class="field pl-10" placeholder="Title, description or place">
            </div>
          </div>
          <div>
            <label for="f-loc" class="field-label">Location</label>
            <select id="f-loc" name="loc" class="field"><option value="">All locations</option></select>
          </div>
          <div>
            <label for="f-from" class="field-label">From date</label>
            <input id="f-from" name="from" type="date" class="field">
          </div>
          <div>
            <label for="f-to" class="field-label">To date</label>
            <input id="f-to" name="to" type="date" class="field">
          </div>
          <button type="button" id="f-clear" class="btn btn-ghost h-12">Clear</button>
        </div>
        <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap gap-2" role="group" aria-label="Time period">
            <button type="button" class="chip" data-when="upcoming" aria-pressed="true">Upcoming</button>
            <button type="button" class="chip" data-when="week" aria-pressed="false">This week</button>
            <button type="button" class="chip" data-when="month" aria-pressed="false">This month</button>
            <button type="button" class="chip" data-when="past" aria-pressed="false">Past</button>
            <button type="button" class="chip" data-when="all" aria-pressed="false">All</button>
          </div>
          <div class="flex items-center gap-2">
            <label for="f-sort" class="text-sm text-ink-600">Sort</label>
            <select id="f-sort" class="field !py-0 !h-10 !w-auto text-sm">
              <option value="soonest">Soonest first</option>
              <option value="latest">Latest first</option>
              <option value="az">Title A–Z</option>
            </select>
          </div>
        </div>
      </form>
    </section>

    <section class="mx-auto max-w-page px-4 sm:px-6 pt-8" aria-label="Event results">
      <div id="event-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6" aria-live="polite" aria-busy="true"></div>
      <div id="pager" class="mt-12"></div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
  <script src="fx.js"></script>
  <script src="components.js"></script>
  <script src="page-events.js"></script>
</body>
</html>
