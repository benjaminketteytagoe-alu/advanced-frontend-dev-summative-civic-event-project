<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications · CivicEvents+</title>
  <meta name="description" content="Your CivicEvents+ notification inbox.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121a2e'/%3E%3Cpath d='M7 14l9-6 9 6M9 14v9M13 14v9M19 14v9M23 14v9M6 25h20' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='6' r='3' fill='%23c8562a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="tw-config.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<!-- PAGE GUARD: any signed-in user. Delete buttons rendered only for admins. -->
<body data-auth="user" data-page="notifications" class="min-h-screen flex flex-col font-sans">
  <div id="app-header"></div>

  <main id="main" tabindex="-1" class="flex-1">
    <section class="mx-auto max-w-page px-4 sm:px-6 pt-10 pb-6">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div>
          <p class="eyebrow mb-2 reveal">Inbox</p>
          <h1 class="font-display text-4xl sm:text-5xl text-ink-900 reveal" style="--d:60ms">Notifications</h1>
          <p class="mt-3 text-ink-600 reveal" style="--d:120ms" id="n-summary" aria-live="polite">Loading…</p>
        </div>
        <div class="flex flex-wrap gap-2 reveal" style="--d:160ms">
          <button type="button" id="mark-all" class="btn btn-ghost">Mark all as read</button>
          <button type="button" id="refresh" class="btn btn-primary">Refresh</button>
        </div>
      </div>
    </section>

    <section class="mx-auto max-w-page px-4 sm:px-6">
      <div class="flex flex-wrap gap-2 mb-5" role="group" aria-label="Filter notifications">
        <button type="button" class="chip" data-f="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-f="unread" aria-pressed="false">Unread</button>
        <button type="button" class="chip" data-f="event" aria-pressed="false">Events</button>
        <button type="button" class="chip" data-f="announcement" aria-pressed="false">Announcements</button>
        <button type="button" class="chip" data-f="promo" aria-pressed="false">Promos</button>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-[1fr_1.15fr] gap-6 items-start">
        <div class="card overflow-hidden">
          <ul id="n-list" class="divide-y divide-paper-200 max-h-[70vh] overflow-y-auto" role="list" aria-label="Notifications" aria-busy="true"></ul>
        </div>
        <div id="n-detail" class="card p-8 lg:sticky lg:top-24 min-h-[18rem]" aria-live="polite">
          <div class="h-full grid place-items-center text-center text-ink-500 py-10">
            <div><div class="mx-auto mb-4 grid place-items-center w-14 h-14 rounded-full bg-paper-200 float-slow">
              <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 13.5 5.5 5h13l2.5 8.5V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13.5h5l1.5 2.5h5l1.5-2.5h5"/></svg></div>
              <p>Select a notification to read it.</p></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
  <script src="ui.js"></script>
  <script src="layout.js"></script>
  <script src="fx.js"></script>
  <script src="components.js"></script>
  <script src="page-notifications.js"></script>
</body>
</html>
