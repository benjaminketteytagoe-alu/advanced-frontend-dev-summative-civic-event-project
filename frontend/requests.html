<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My requests · CivicEvents+</title>
  <meta name="description" content="Report a problem and follow what happens.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121a2e'/%3E%3Cpath d='M7 14l9-6 9 6M9 14v9M13 14v9M19 14v9M23 14v9M6 25h20' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='6' r='3' fill='%23c8562a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="tw-config.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<!-- PAGE GUARD: any signed-in user -->
<body data-auth="user" data-page="requests" class="min-h-screen flex flex-col font-sans">
  <div id="app-header"></div>

  <main id="main" tabindex="-1" class="flex-1">
    <section class="mx-auto max-w-page px-4 sm:px-6 pt-10 pb-6">
      <p class="eyebrow mb-2 reveal">Help fix your community</p>
      <h1 class="font-display text-4xl sm:text-5xl text-ink-900 reveal">Service requests</h1>
      <p class="mt-3 text-ink-600 reveal">Report a problem, then follow what happens to it here.</p>
    </section>

    <div class="mx-auto max-w-page px-4 sm:px-6 grid grid-cols-1 lg:grid-cols-[1fr_1.2fr] gap-8 items-start">
      <!-- Users only. Admins answer requests on their own page -->
      <form id="req-form" class="card p-6 sm:p-8 space-y-5" novalidate aria-labelledby="form-h" data-role="user" hidden>
        <h2 id="form-h" class="font-display text-2xl text-ink-900">New request</h2>
        <div class="form-row">
          <label for="type" class="field-label">What is it about?</label>
          <select id="type" name="type" class="field" required><option value="">Loading…</option></select>
        </div>
        <div class="form-row">
          <label for="location" class="field-label">Where is it?</label>
          <input id="location" name="location" type="text" class="field" required maxlength="200" placeholder="e.g. Market Street, near the bank">
        </div>
        <div class="form-row">
          <label for="description" class="field-label">What is wrong?</label>
          <textarea id="description" name="description" rows="5" class="field resize-y" required maxlength="1000"></textarea>
        </div>
        <button type="submit" id="send-btn" class="btn btn-primary">Send request</button>
      </form>
      <div class="card p-6" data-role="admin" hidden>
        <h2 class="font-display text-2xl text-ink-900 mb-3">You are an administrator</h2>
        <a href="admin-requests.html" class="btn btn-primary">Answer requests</a>
      </div>

      <section aria-labelledby="list-h">
        <h2 id="list-h" class="font-display text-2xl text-ink-900 mb-4">Your requests</h2>
        <div id="req-list" class="space-y-4" aria-live="polite" aria-busy="true"></div>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
  <script src="fx.js"></script>
  <script src="components.js"></script>
  <script src="page-requests.js"></script>
</body>
</html>
