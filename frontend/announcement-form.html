<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Announcement editor · CivicEvents+</title>
  <meta name="description" content="Upload or edit an audio announcement.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121a2e'/%3E%3Cpath d='M7 14l9-6 9 6M9 14v9M13 14v9M19 14v9M23 14v9M6 25h20' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='6' r='3' fill='%23c8562a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="tw-config.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<!-- PAGE GUARD: admins only -->
<body data-auth="admin" data-page="announcement-form" class="min-h-screen flex flex-col font-sans">
  <div id="app-header"></div>

  <main id="main" tabindex="-1" class="flex-1">
    <div class="mx-auto max-w-3xl px-4 sm:px-6 pt-8 pb-4">
      <a id="back-link" href="announcements.html" class="inline-flex items-center gap-2 text-sm font-medium text-ink-600 hover:text-ink-900 transition group">
        <span class="transition-transform group-hover:-translate-x-1" aria-hidden="true">←</span> Back</a>
      <p class="eyebrow mt-6 mb-2">Admin · Announcements</p>
      <h1 id="form-title" class="font-display text-4xl sm:text-5xl text-ink-900">New announcement</h1>
      <p class="mt-3 text-ink-600">Publishing an announcement automatically notifies every member in-app.</p>
    </div>

    <div class="mx-auto max-w-3xl px-4 sm:px-6 pt-4">
      <form id="ann-form" class="card p-6 sm:p-8 space-y-6" novalidate enctype="multipart/form-data">
        <div class="form-row">
          <label for="title" class="field-label">Title <span class="text-ember-600" aria-hidden="true">*</span></label>
          <input id="title" name="title" type="text" class="field" required maxlength="200" placeholder="e.g. Road closures this weekend">
        </div>

        <div class="form-row" id="audio-row">
          <span class="field-label" id="audio-label">Audio file <span class="text-ember-600" aria-hidden="true">*</span></span>
          <label id="dropzone" for="audio" class="dropzone flex flex-col items-center text-center gap-3 p-8 cursor-pointer" aria-describedby="audio-hint">
            <span class="grid place-items-center w-14 h-14 rounded-full bg-ink-900 text-white float-slow">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span>
            <span class="font-semibold text-ink-900">Drop an audio file or <span class="text-ember-700 underline underline-offset-2">browse</span></span>
            <span id="audio-hint" class="text-sm text-ink-500">MP3, WAV, M4A or OGG up to 5 MB</span>
            <input id="audio" name="audio" type="file" accept=".mp3,.wav,.m4a,.ogg,audio/*" class="sr-only" aria-labelledby="audio-label" required>
          </label>
          <div id="audio-preview" class="hidden mt-4 rounded-xl border border-paper-300 bg-white p-4">
            <div class="flex items-center justify-between gap-3 text-sm mb-3"><span id="audio-meta" class="flex items-center gap-2 min-w-0"></span><span id="audio-dur" class="font-mono text-ink-600 shrink-0"></span></div>
            <audio id="audio-player" controls class="w-full" preload="metadata">Your browser can’t preview this audio file.</audio>
          </div>
        </div>

        <!-- Shown when editing -->
        <div id="current-audio" class="hidden form-row">
          <span class="field-label">Current audio</span>
          <div class="rounded-xl border border-paper-300 bg-white p-4">
            <audio id="current-player" controls class="w-full" preload="metadata">Your browser can’t play this audio file.</audio>
            <p class="field-hint mt-2">Choose a new file above to replace it.</p>
          </div>
        </div>

        <div class="flex items-center justify-between gap-4 rounded-xl border border-paper-300 bg-white/60 p-4">
          <label for="published" class="cursor-pointer">
            <span class="block font-semibold text-ink-900">Published</span>
            <span class="block text-sm text-ink-500">Unpublished announcements are only visible to admins.</span>
          </label>
          <input id="published" name="published" type="checkbox" class="switch" role="switch" checked>
        </div>

        <div class="js-progress hidden" aria-live="polite">
          <div class="flex justify-between text-xs text-ink-600 mb-1.5"><span class="js-pct">Uploading…</span></div>
          <div class="progress" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        </div>

        <div class="flex flex-wrap gap-3 pt-2">
          <button type="submit" class="btn btn-primary btn-lg" id="submit-btn">Publish announcement</button>
          <a href="announcements.html" class="btn btn-ghost btn-lg" id="cancel-link">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
  <script src="ui.js"></script>
  <script src="layout.js"></script>
  <script src="fx.js"></script>
  <script src="components.js"></script>
  <script src="page-announcement-form.js"></script>
</body>
</html>
