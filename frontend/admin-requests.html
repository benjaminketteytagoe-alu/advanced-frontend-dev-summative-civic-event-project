<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage requests · CivicEvents+</title>
  <meta name="description" content="Answer service requests.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121a2e'/%3E%3Cpath d='M7 14l9-6 9 6M9 14v9M13 14v9M19 14v9M23 14v9M6 25h20' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='6' r='3' fill='%23c8562a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="tw-config.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<!-- PAGE GUARD: admins only -->
<body data-auth="admin" data-page="admin-requests" class="min-h-screen flex flex-col font-sans">
  <div id="app-header"></div>

  <main id="main" tabindex="-1" class="flex-1">
    <div class="mx-auto max-w-page px-4 sm:px-6 pt-8 grid grid-cols-1 lg:grid-cols-[15rem_1fr] gap-8">
      <aside id="admin-side" aria-label="Admin navigation"></aside>

      <div class="min-w-0">
        <p class="eyebrow mb-2">Admin</p>
        <h1 class="font-display text-4xl sm:text-5xl text-ink-900">Service requests</h1>
        <p id="req-count" class="mt-2 text-sm text-ink-600" aria-live="polite">Loading…</p>

        <div class="mt-6 flex flex-wrap gap-2" role="group" aria-label="Filter by status">
          <button type="button" class="chip" data-f="all" aria-pressed="true">All</button>
          <button type="button" class="chip" data-f="open" aria-pressed="false">Open</button>
          <button type="button" class="chip" data-f="in_progress" aria-pressed="false">In progress</button>
          <button type="button" class="chip" data-f="done" aria-pressed="false">Done</button>
          <button type="button" class="chip" data-f="declined" aria-pressed="false">Declined</button>
        </div>
        <h2 class="sr-only">Request list</h2>
        <div id="req-list" class="mt-4 space-y-4" aria-live="polite" aria-busy="true"></div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
  <script src="fx.js"></script>
  <script src="components.js"></script>
  <script src="page-admin-requests.js"></script>
</body>
</html>
