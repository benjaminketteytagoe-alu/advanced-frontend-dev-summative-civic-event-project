<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard · CivicEvents+</title>
  <meta name="description" content="CivicEvents+ administrator dashboard.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121a2e'/%3E%3Cpath d='M7 14l9-6 9 6M9 14v9M13 14v9M19 14v9M23 14v9M6 25h20' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='6' r='3' fill='%23c8562a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="tw-config.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Chart palette — validated with the dataviz CVD checker (all checks pass on light surface) */
    .viz { --s1: #4a5fc1; --s2: #d9822b; --s3: #2a9d8f; --grid: #efe9db; --axis: #6a7ca3; }
    .viz-tip { position: absolute; pointer-events: none; z-index: 20; background: #121a2e; color: #fff; font-size: .75rem; padding: .45rem .6rem; border-radius: 8px; white-space: nowrap; box-shadow: 0 10px 24px -10px rgba(11,17,32,.6); opacity: 0; transform: translate(-50%, -110%); transition: opacity .15s; }
    .viz-tip.on { opacity: 1; }
    .viz .hit { cursor: default; }
    .viz .bar { transform-box: fill-box; }
    .viz .grow-y { transform-origin: bottom; animation: gy .9s cubic-bezier(.16,1,.3,1) both; animation-delay: var(--d, 0ms); }
    .viz .grow-x { transform-origin: left; animation: gx .9s cubic-bezier(.16,1,.3,1) both; animation-delay: var(--d, 0ms); }
    @keyframes gy { from { transform: scaleY(0); } } @keyframes gx { from { transform: scaleX(0); } }
    .viz g.col:hover .bar, .viz g.col:focus .bar { filter: brightness(1.12); }
    @media (prefers-reduced-motion: reduce) { .viz .grow-y, .viz .grow-x { animation: none; } }
  </style>
</head>
<!-- PAGE GUARD: data-auth="admin" — normal users see a 403 panel; GET /api/dashboard/admin is never called for them -->
<body data-auth="admin" data-page="admin" class="min-h-screen flex flex-col font-sans">
  <div id="app-header"></div>

  <main id="main" tabindex="-1" class="flex-1">
    <div class="mx-auto max-w-page px-4 sm:px-6 pt-8 grid grid-cols-1 lg:grid-cols-[15rem_1fr] gap-8">
      <aside id="admin-side" aria-label="Admin navigation"></aside>

      <div class="min-w-0">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
          <div>
            <p class="eyebrow mb-2">Admin</p>
            <h1 class="font-display text-4xl sm:text-5xl text-ink-900">Overview</h1>
            <p class="mt-2 text-sm text-ink-600" aria-live="polite"><span id="updated">Loading live numbers…</span></p>
          </div>
          <div class="flex flex-wrap items-center gap-3">
            <label class="flex items-center gap-2 text-sm text-ink-700"><input id="auto" type="checkbox" class="switch" role="switch" checked> Auto-refresh (60s)</label>
            <button type="button" id="refresh" class="btn btn-primary">Refresh</button>
          </div>
        </div>

        <section aria-label="Key figures"><div id="kpis" class="grid grid-cols-2 xl:grid-cols-4 gap-4"></div></section>

        <section class="mt-8 grid xl:grid-cols-[1.4fr_1fr] gap-6">
          <figure class="card p-6 viz relative" aria-labelledby="c1-t">
            <figcaption><h2 id="c1-t" class="font-display text-xl text-ink-900">New members per month</h2>
              <p class="text-xs text-ink-500 mt-1">Sign-ups over the last six months</p></figcaption>
            <div id="chart-growth" class="mt-5 relative"></div>
          </figure>
          <figure class="card p-6 viz relative" aria-labelledby="c2-t">
            <figcaption><h2 id="c2-t" class="font-display text-xl text-ink-900">Event timeline</h2>
              <p class="text-xs text-ink-500 mt-1">How the event catalogue splits by date</p></figcaption>
            <div id="chart-events" class="mt-5 relative"></div>
          </figure>
        </section>

        <section class="mt-6 grid xl:grid-cols-[1fr_1.4fr] gap-6">
          <figure class="card p-6 viz relative" aria-labelledby="c3-t">
            <figcaption><h2 id="c3-t" class="font-display text-xl text-ink-900">Member accounts</h2>
              <p class="text-xs text-ink-500 mt-1">Active vs disabled</p></figcaption>
            <div id="chart-users" class="mt-5 relative"></div>
          </figure>
          <figure class="card p-6 viz relative" aria-labelledby="c4-t">
            <figcaption><h2 id="c4-t" class="font-display text-xl text-ink-900">Engagement & content</h2>
              <p class="text-xs text-ink-500 mt-1">Totals across the platform</p></figcaption>
            <div id="chart-content" class="mt-5 relative"></div>
          </figure>
        </section>

        <details class="card mt-6 p-6 group">
          <summary class="cursor-pointer font-semibold text-ink-900 list-none flex items-center justify-between">View all figures as a table <span class="transition-transform group-open:rotate-180" aria-hidden="true">▾</span></summary>
          <div id="stats-table" class="mt-4 overflow-x-auto"></div>
        </details>

        <section class="mt-8 card overflow-hidden" aria-labelledby="recent-h">
          <div class="px-6 py-4 border-b border-paper-200 flex items-center justify-between">
            <h2 id="recent-h" class="font-display text-xl text-ink-900">Recent notifications</h2>
            <a href="admin-notifications.html" class="text-sm font-semibold text-ember-700 hover:underline">Manage</a>
          </div>
          <ul id="recent" class="divide-y divide-paper-200"></ul>
        </section>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
  <script src="fx.js"></script>
  <script src="components.js"></script>
  <script src="page-admin.js"></script>
</body>
</html>
