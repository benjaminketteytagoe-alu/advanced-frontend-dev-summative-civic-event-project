<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Announcements · CivicEvents+</title>
  <meta name="description" content="Listen to audio announcements from your civic office.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121a2e'/%3E%3Cpath d='M7 14l9-6 9 6M9 14v9M13 14v9M19 14v9M23 14v9M6 25h20' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='6' r='3' fill='%23c8562a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="tw-config.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<!-- PAGE GUARD: any signed-in user (unpublished items are filtered out for non-admins) -->
<body data-auth="user" data-page="announcements" class="min-h-screen flex flex-col font-sans">
  <div id="app-header"></div>

  <main id="main" tabindex="-1" class="flex-1">
    <section class="mx-auto max-w-page px-4 sm:px-6 pt-10 pb-8">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div>
          <p class="eyebrow mb-2 reveal">On air</p>
          <h1 class="font-display text-4xl sm:text-5xl text-ink-900 reveal" style="--d:60ms">Announcements</h1>
          <p class="mt-3 text-ink-600 max-w-xl reveal" style="--d:120ms">Short audio briefings from the civic office. Press play on any card, or open one for the full player and transcript.</p>
        </div>
        <!-- ADMIN-ONLY -->
        <a href="announcement-form.html" class="btn btn-accent reveal" data-role="admin" hidden>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New announcement</a>
      </div>
    </section>

    <section class="mx-auto max-w-page px-4 sm:px-6" aria-label="Filter announcements">
      <div class="card p-4 flex flex-col sm:flex-row gap-3 sm:items-center justify-between reveal" style="--d:160ms">
        <div class="relative flex-1 max-w-md">
          <label for="a-q" class="sr-only">Search announcements</label>
          <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-ink-400"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
          <input id="a-q" type="search" class="field pl-10" placeholder="Search by title">
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <!-- ADMIN-ONLY status filter -->
          <div class="flex gap-2" role="group" aria-label="Status" data-role="admin" hidden>
            <button type="button" class="chip" data-status="all" aria-pressed="true">All</button>
            <button type="button" class="chip" data-status="published" aria-pressed="false">Published</button>
            <button type="button" class="chip" data-status="draft" aria-pressed="false">Unpublished</button>
          </div>
          <label for="a-sort" class="sr-only">Sort</label>
          <select id="a-sort" class="field !py-0 !h-10 !w-auto text-sm"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">Title A–Z</option></select>
        </div>
      </div>
    </section>

    <section class="mx-auto max-w-page px-4 sm:px-6 pt-8" aria-label="Announcement list">
      <p id="a-summary" class="text-sm text-ink-600 mb-4" aria-live="polite"></p>
      <h2 class="sr-only">Announcement list</h2>
      <div id="ann-list" class="grid lg:grid-cols-2 gap-4" aria-busy="true"></div>
      <div id="pager" class="mt-12"></div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
  <script src="fx.js"></script>
  <script src="components.js"></script>
  <script src="page-announcements.js"></script>
</body>
</html>
